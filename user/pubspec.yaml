name: user
description: Aplicación de usuario de RushGo refactorizada con Clean Architecture

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Gestión de estado
  flutter_riverpod: ^2.6.1
  # Navegación
  go_router: ^14.8.1
  # Almacenamiento local
  shared_preferences: ^2.5.2
  # Networking
  dio: ^5.8.0+1
  # Firebase
  firebase_core: ^2.32.0
  #firebase_core: ^3.8.0
  firebase_auth: ^4.16.0
  #firebase_auth: ^5.3.3
  cloud_firestore: ^4.17.5
  #cloud_firestore: ^5.5.0
  firebase_messaging: ^14.7.10
  # Localización
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.1
  # Utilidades
  intl: ^0.20.2
  logger: ^2.5.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.0.3
  flutter_local_notifications: ^19.0.0
  geoflutterfire2: ^2.3.15

  http: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/imgs/
    - assets/fonts/
    - assets/jsons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300